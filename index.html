  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-700 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        window.__shromikDeferredInstallPrompt = null;
        window.__shromikAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__shromikDeferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('shromik:pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__shromikDeferredInstallPrompt = null;
          window.__shromikAppInstalled = true;
          window.dispatchEvent(new CustomEvent('shromik:pwa-installed'));
        });

        // Prevent iOS Safari pinch gestures without blocking native 1-finger or mouse-wheel compositor scrolling
        var preventGestureZoom = function (e) {
          e.preventDefault();
        };
        document.addEventListener('gesturestart', preventGestureZoom, { passive: false });
        document.addEventListener('gesturechange', preventGestureZoom, { passive: false });
        document.addEventListener('gestureend', preventGestureZoom, { passive: false });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
