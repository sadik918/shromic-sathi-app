    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteWebSocket() {
          this.readyState = 1;
          this.bufferedAmount = 0;
          this.extensions = '';
          this.protocol = 'vite-hmr';
          this.url = '';
          this.binaryType = 'blob';
          this.onopen = null;
          this.onerror = null;
          this.onclose = null;
          this.onmessage = null;
        }
        MockViteWebSocket.prototype.addEventListener = function (type, listener) {
          if (type === 'open' && typeof listener === 'function') {
            setTimeout(function () {
              try {
                listener(new Event('open'));
              } catch (_e) {}
            }, 0);
          }
        };
        MockViteWebSocket.prototype.removeEventListener = function () {};
        MockViteWebSocket.prototype.dispatchEvent = function () {
          return true;
        };
        MockViteWebSocket.prototype.send = function () {};
        MockViteWebSocket.prototype.close = function () {
          this.readyState = 3;
        };
        var WrappedWebSocket = function (url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
            return new MockViteWebSocket();
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        };
        WrappedWebSocket.prototype = NativeWebSocket.prototype;
        WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
        WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = WrappedWebSocket;
      })();
    </script>
